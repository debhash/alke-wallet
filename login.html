<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Alke Wallet - Iniciar Sesión</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="container container-login">
            <header>
                <h1 class="h2 mb-4">Iniciar Sesión</h1>
            </header>
            <form id="login-form">
                <div id="login-message" class="alert alert-danger d-none" role="alert"></div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    />
                </div>
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>

            <section class="card wallet-card mt-4" aria-labelledby="clientes-demo">
                <div class="card-body">
                    <h2 class="h5 card-title" id="clientes-demo">Clientes de prueba</h2>
                    <p class="card-text mb-2">Cliente 1: ana@wallet.cl / Ana123</p>
                    <p class="card-text mb-0">Cliente 2: pedro@wallet.cl / Pedro123</p>
                </div>
            </section>
        </main>

        <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"
        ></script>
        <script>
            const dummyClients = [
                {
                    name: "Ana Perez",
                    email: "ana@wallet.cl",
                    password: "Ana123",
                },
                {
                    name: "Pedro Soto",
                    email: "pedro@wallet.cl",
                    password: "Pedro123",
                },
            ];

            $(function () {
                const $loginForm = $("#login-form");
                const $emailInput = $("#email");
                const $passwordInput = $("#password");
                const $loginMessage = $("#login-message");

                $loginForm.on("submit", function (event) {
                    event.preventDefault();

                    const email = $emailInput.val().trim().toLowerCase();
                    const password = $passwordInput.val().trim();

                    const client = dummyClients.find((item) => item.email === email && item.password === password);

                    if (!client) {
                        $loginMessage
                            .text("Credenciales incorrectas. Verifica el correo y la contraseña.")
                            .removeClass("d-none");
                        return;
                    }

                    sessionStorage.setItem("walletUser", JSON.stringify(client));
                    window.location.href = "menu.html";
                });
            });
        </script>
    </body>
</html>
