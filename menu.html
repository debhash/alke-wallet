<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Alke Wallet - Menú Principal</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="container">
            <header>
                <h1 class="h2 mb-4">Menú Principal</h1>
            </header>

            <nav class="navbar navbar-expand-lg wallet-navbar mb-4" aria-label="Menú principal">
                <div class="container-fluid px-3">
                    <a href="menu.html" class="navbar-brand mb-0 text-decoration-none">Alke Wallet</a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#wallet-navbar-content"
                        aria-controls="wallet-navbar-content"
                        aria-expanded="false"
                        aria-label="Mostrar navegación"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="wallet-navbar-content">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-2">
                            <li class="nav-item">
                                <a href="menu.html" class="nav-link">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a href="deposit.html" class="nav-link">Depositar</a>
                            </li>
                            <li class="nav-item">
                                <a href="sendmoney.html" class="nav-link">Enviar dinero</a>
                            </li>
                            <li class="nav-item">
                                <a href="transactions.html" class="nav-link">Movimientos</a>
                            </li>
                        </ul>
                        <div class="wallet-actions">
                            <button
                                type="button"
                                class="btn btn-outline-danger btn-sm wallet-logout"
                                id="logout-button"
                            >
                                Cerrar sesión
                            </button>
                        </div>
                    </div>
                </div>
            </nav>

            <section class="card wallet-card mb-4" aria-labelledby="saldo-actual">
                <div class="card-body">
                    <h2 class="h5 card-title" id="saldo-actual">Saldo actual</h2>
                    <p class="card-text fs-4 fw-bold text-success" id="menu-balance">$ 350.000 CLP</p>
                </div>
            </section>
        </main>

        <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="js/wallet.js"></script>
        <script src="js/menu.js"></script>
    </body>
</html>
