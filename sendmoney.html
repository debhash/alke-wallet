<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wallet Digital jQuery - Enviar Dinero</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="container">
            <nav class="navbar navbar-expand-lg wallet-navbar mb-4" aria-label="Menú principal">
                <div class="container-fluid px-3">
                    <a href="menu.html" class="navbar-brand mb-0 text-decoration-none">Wallet Digital jQuery</a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#wallet-navbar-content"
                        aria-controls="wallet-navbar-content"
                        aria-expanded="false"
                        aria-label="Mostrar navegación"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="wallet-navbar-content">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-2">
                            <li class="nav-item">
                                <a href="menu.html" class="nav-link">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a href="deposit.html" class="nav-link">Depositar</a>
                            </li>
                            <li class="nav-item">
                                <a href="sendmoney.html" class="nav-link">Enviar dinero</a>
                            </li>
                            <li class="nav-item">
                                <a href="transactions.html" class="nav-link">Movimientos</a>
                            </li>
                        </ul>
                        <div class="wallet-actions">
                            <button
                                type="button"
                                class="btn btn-outline-danger btn-sm wallet-logout"
                                id="logout-button"
                            >
                                Cerrar sesión
                            </button>
                        </div>
                    </div>
                </div>
            </nav>

            <header>
                <h1 class="h2 mb-4">Enviar Dinero</h1>
            </header>

            <section class="card wallet-card mb-4" aria-labelledby="saldo-envio">
                <div class="card-body">
                    <h2 class="h5 card-title" id="saldo-envio">Saldo disponible</h2>
                    <p class="card-text fs-4 fw-bold text-success mb-0" id="send-balance">$ 350.000 CLP</p>
                </div>
            </section>

            <section aria-labelledby="formulario-envio">
                <!-- esto es para screen readers -->
                <h2 class="visually-hidden" id="formulario-envio">Formulario de búsqueda de contactos</h2>
                <form class="mb-3" id="contact-search-form">
                    <div id="send-message" class="alert d-none" role="alert"></div>
                    <div class="mb-3">
                        <label for="buscar-contacto" class="form-label">Buscar en agenda de transferencias</label>
                        <select class="form-select" id="buscar-contacto">
                            <option value="">Selecciona un contacto</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Seleccionar</button>
                </form>
            </section>

            <section
                class="card wallet-card mb-4 d-none"
                id="selected-contact-card"
                aria-labelledby="contacto-seleccionado"
            >
                <div class="card-body">
                    <h2 class="h5 card-title" id="contacto-seleccionado">Contacto seleccionado</h2>
                    <p class="mb-1 fw-semibold" id="selected-contact-name"></p>
                    <p class="mb-1 text-muted" id="selected-contact-bank"></p>
                    <p class="mb-0 text-muted" id="selected-contact-alias"></p>
                </div>
            </section>

            <section class="d-none" id="transfer-section" aria-labelledby="formulario-transferencia">
                <h2 class="h5 mb-3" id="formulario-transferencia">Realizar transferencia</h2>
                <form id="send-money-form">
                    <div class="mb-3">
                        <label for="transfer-amount" class="form-label">Monto a transferir</label>
                        <input
                            type="text"
                            class="form-control"
                            id="transfer-amount"
                            placeholder="Ingresa el monto"
                            inputmode="numeric"
                            autocomplete="off"
                            required
                        />
                    </div>
                    <div class="mb-3">
                        <label for="transfer-note" class="form-label">Motivo</label>
                        <input
                            type="text"
                            class="form-control"
                            id="transfer-note"
                            placeholder="Ejemplo: arriendo, regalo, almuerzo"
                        />
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enviar dinero</button>
                </form>
            </section>

            <section aria-labelledby="acciones-contactos">
                <!-- esto es para screen readers -->
                <h2 class="visually-hidden" id="acciones-contactos">Acciones de contactos</h2>
                <button
                    type="button"
                    class="btn btn-outline-primary w-100 mb-4"
                    data-bs-toggle="modal"
                    data-bs-target="#nuevoContactoModal"
                >
                    Agregar nuevo contacto
                </button>
            </section>
        </main>

        <section
            class="modal fade"
            id="nuevoContactoModal"
            tabindex="-1"
            aria-labelledby="nuevoContactoModalLabel"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="h5 modal-title" id="nuevoContactoModalLabel">Agregar nuevo contacto</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <form id="new-contact-form">
                            <div class="mb-3">
                                <label for="nombre-contacto" class="form-label">Nombre y apellido</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre-contacto"
                                    placeholder="Ingresa el nombre y apellido"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="numero-cuenta-contacto" class="form-label">Número de cuenta</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="numero-cuenta-contacto"
                                    placeholder="Ingresa el número de cuenta"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="alias-contacto" class="form-label">Alias</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="alias-contacto"
                                    placeholder="Ingresa el alias"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="banco-contacto" class="form-label">Nombre del Banco</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="banco-contacto"
                                    placeholder="Ingresa el nombre del banco"
                                    required
                                />
                            </div>
                            <div id="contact-message" class="alert d-none" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100">Guardar contacto</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="js/wallet.js"></script>
        <script src="js/sendmoney.js"></script>
    </body>
</html>
